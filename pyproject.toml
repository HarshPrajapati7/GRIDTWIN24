[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridtwin24"
version = "0.1.0"
description = "Open forecast-to-action energy intelligence with a low-voltage DC energy bench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "joblib>=1.3"
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.18"]
agent = ["google-genai>=1.0"]
hardware = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.0", "python-pptx>=0.6.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
